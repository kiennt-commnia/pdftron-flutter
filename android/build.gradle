group 'com.pdftron.pdftronflutter'
version '2.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://pdftron-maven.s3.amazonaws.com/release"
        }
    }
}

apply plugin: 'com.android.library'

android {
    namespace "com.pdftron.pdftronflutter"
    // Match host apps targeting API 35+ / 16 KB page size (Play); Apryse 11.9+ ships 16 KB–aligned native libs.
    compileSdkVersion 35

    defaultConfig {
        minSdkVersion 19
        vectorDrawables.useSupportLibrary = true
    }
    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    // Apryse SDK — 11.9+ required for 16 KB memory page support (arm64/x86_64).
    implementation "com.pdftron:pdftron:11.12.0"
    implementation "com.pdftron:tools:11.12.0"
}
